<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
        (function() {
            var cachedTheme = localStorage.getItem('user_theme');
            if (cachedTheme) {
                document.body.setAttribute('data-theme', cachedTheme);
            }
        })();
    </script>
    <title>工作流管理 - AI Chat Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/workflows.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-secondary: var(--bg-color);
            --text-primary: var(--text-color);
            --bg-tertiary: var(--hover-bg);
        }
        body[data-theme="light"] {
            --bg-secondary: #f0f0f0;
            --text-primary: #1a1a1a;
            --bg-tertiary: #e5e5e5;
        }
        body[data-theme="blue"] {
            --bg-secondary: #1e293b;
            --text-primary: #ececec;
            --bg-tertiary: #334155;
        }
        body[data-theme="green"] {
            --bg-secondary: #1a2e1a;
            --text-primary: #ececec;
            --bg-tertiary: #2d4d2d;
        }
        body[data-theme="purple"] {
            --bg-secondary: #2a1a3a;
            --text-primary: #ececec;
            --bg-tertiary: #4d2d6d;
        }

        /* 头部布局样式 - 与Agent管理页面保持一致 */
        .workflows-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 100%;
            min-width: 0;
        }
        .workflows-header .search-wrapper {
            flex: 1;
            max-width: 350px;
            min-width: 150px;
            width: 100%;
        }
        .workflows-header .btn-primary {
            padding: 8px 14px;
            height: 36px;
            white-space: nowrap;
            flex-shrink: 0;
            box-sizing: border-box;
            min-width: auto;
        }
        .workflows-header .btn-primary span {
            display: inline;
        }

        @media (max-width: 1024px) {
            .page-header {
                height: auto;
                min-height: 60px;
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 12px;
            }
            .page-header h1 {
                width: 100%;
                flex-shrink: 0;
            }
            .workflows-header {
                gap: 10px;
                flex-wrap: wrap;
                width: 100%;
                min-width: 0;
            }
            .workflows-header .search-wrapper {
                max-width: none;
                flex: 1;
                min-width: 200px;
            }
            .workflows-header .btn-primary {
                padding: 8px 12px;
                font-size: 13px;
                flex-shrink: 0;
            }
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 12px 16px;
            }
            .page-header h1 {
                font-size: 18px;
            }
            .workflows-header {
                flex-wrap: wrap;
                gap: 10px;
                width: 100%;
                min-width: 0;
            }
            .workflows-header .search-wrapper {
                order: 2;
                max-width: 100%;
                flex: 1;
                min-width: 0;
            }
            .workflows-header .btn-primary {
                order: 1;
                padding: 8px 12px;
                font-size: 13px;
                flex-shrink: 0;
                min-width: auto;
            }
            .workflows-header .btn-primary i {
                margin-right: 4px;
                flex-shrink: 0;
            }
            .workflows-header .btn-primary span {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                display: inline-block;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 10px 12px;
                gap: 10px;
            }
            .page-header h1 {
                font-size: 16px;
            }
            .sidebar-toggle {
                padding: 6px 8px;
            }
            .workflows-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .workflows-header .search-wrapper {
                order: 1;
                width: 100%;
                max-width: 100%;
                min-width: 120px;
            }
            .workflows-header .btn-primary {
                order: 2;
                width: 100%;
                justify-content: center;
                padding: 8px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .workflows-header .btn-primary {
                padding: 7px 8px;
                font-size: 11px;
            }
            .workflows-header .search-wrapper {
                min-width: 100px;
            }
        }

        @media (max-width: 375px) {
            .workflows-header .btn-primary {
                padding: 8px 10px;
            }
            .workflows-header .btn-primary span {
                display: none;
            }
            .workflows-header .btn-primary::after {
                content: "新建";
            }
            .page-header h1 {
                font-size: 15px;
            }
            .sidebar-toggle {
                padding: 5px 6px;
                font-size: 14px;
            }
        }

        /* 搜索框样式 - 与Agent管理页面保持一致 */
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color, #d0d0d0);
            border-radius: 8px;
            padding: 5px 12px;
            width: 100%;
            height: 36px;
            box-sizing: border-box;
        }
        .search-box i {
            color: #888;
            flex-shrink: 0;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #333333;
            flex: 1;
            min-width: 0;
            outline: none;
            font-size: 14px;
        }
        .search-box input::placeholder {
            color: #888;
        }
        .search-box:focus-within {
            border-color: var(--primary-color, #10a37f);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.15);
        }

        body[data-theme="light"] .search-box {
            background: #ffffff;
            border-color: #d0d0d0;
        }
        body[data-theme="light"] .search-box input {
            color: #333333;
        }
        body[data-theme="light"] .search-box i,
        body[data-theme="light"] .search-box input::placeholder {
            color: #888;
        }

        body[data-theme="dark"] .search-box,
        body[data-theme="blue"] .search-box,
        body[data-theme="green"] .search-box,
        body[data-theme="purple"] .search-box,
        body[data-theme="red"] .search-box,
        body[data-theme="orange"] .search-box,
        body[data-theme="pink"] .search-box,
        body[data-theme="cyan"] .search-box,
        body[data-theme="indigo"] .search-box {
            background: #2a2a2a;
            border-color: #404040;
        }
        body[data-theme="dark"] .search-box input,
        body[data-theme="blue"] .search-box input,
        body[data-theme="green"] .search-box input,
        body[data-theme="purple"] .search-box input,
        body[data-theme="red"] .search-box input,
        body[data-theme="orange"] .search-box input,
        body[data-theme="pink"] .search-box input,
        body[data-theme="cyan"] .search-box input,
        body[data-theme="indigo"] .search-box input {
            color: #e0e0e0;
        }
        body[data-theme="dark"] .search-box i,
        body[data-theme="dark"] .search-box input::placeholder,
        body[data-theme="blue"] .search-box i,
        body[data-theme="blue"] .search-box input::placeholder,
        body[data-theme="green"] .search-box i,
        body[data-theme="green"] .search-box input::placeholder,
        body[data-theme="purple"] .search-box i,
        body[data-theme="purple"] .search-box input::placeholder,
        body[data-theme="red"] .search-box i,
        body[data-theme="red"] .search-box input::placeholder,
        body[data-theme="orange"] .search-box i,
        body[data-theme="orange"] .search-box input::placeholder,
        body[data-theme="pink"] .search-box i,
        body[data-theme="pink"] .search-box input::placeholder,
        body[data-theme="cyan"] .search-box i,
        body[data-theme="cyan"] .search-box input::placeholder,
        body[data-theme="indigo"] .search-box i,
        body[data-theme="indigo"] .search-box input::placeholder {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    <span>AI Chat</span>
                </div>
                <a href="/" class="new-chat-btn">
                    <i class="fas fa-plus"></i>
                    <span>新对话</span>
                </a>
            </div>
            
            <div class="sidebar-nav">
                <a href="/" class="nav-item">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回聊天</span>
                </a>
                <div class="nav-item active">
                    <i class="fas fa-project-diagram"></i>
                    <span>工作流管理</span>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span id="username">加载中...</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>工作流管理</h1>
                <div class="header-actions workflows-header">
                    <div class="search-wrapper">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="搜索工作流名称、描述、创建者...">
                            <button class="search-clear" id="searchClear" style="display: none;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="createWorkflowBtn">
                        <i class="fas fa-plus"></i>
                        <span>新建工作流</span>
                    </button>
                </div>
            </header>

            <div class="workflows-container">
                <!-- 搜索结果信息 -->
                <div class="search-info" id="searchInfo" style="display: none;">
                    <span id="searchResultCount"></span>
                    <button class="btn btn-link" id="clearSearchBtn">清除搜索</button>
                </div>
                
                <!-- 工作流列表 -->
                <div class="workflows-list" id="workflowsList">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>加载中...</span>
                    </div>
                </div>
                
                <!-- 分页控件 -->
                <div class="pagination" id="pagination" style="display: none;">
                    <button class="page-btn" id="prevPageBtn" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="page-info" id="pageInfo"></span>
                    <button class="page-btn" id="nextPageBtn" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 创建/编辑工作流模态框 -->
    <div class="modal" id="workflowModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="workflowModalTitle">新建工作流</h2>
                <button class="modal-close" id="closeWorkflowModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="workflowForm">
                    <div class="form-group">
                        <label for="workflowName">工作流名称</label>
                        <input type="text" id="workflowName" name="name" required placeholder="请输入工作流名称">
                    </div>
                    <div class="form-group">
                        <label for="workflowDescription">描述</label>
                        <textarea id="workflowDescription" name="description" rows="3" placeholder="请输入工作流描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="workflowStatus">状态</label>
                        <select id="workflowStatus" name="status">
                            <option value="draft">草稿</option>
                            <option value="active">启用</option>
                            <option value="paused">暂停</option>
                            <option value="archived">归档</option>
                        </select>
                    </div>
                    <input type="hidden" id="workflowId" name="id" value="">
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelWorkflowBtn">取消</button>
                <button class="btn btn-primary" id="saveWorkflowBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal" id="confirmDeleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>确认删除</h2>
                <button class="modal-close" id="closeDeleteModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p id="deleteMessage">确定要删除这个工作流吗？此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/workflows.js') }}"></script>
</body>
</html>
